<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-height studio. Top bar with the three steps, tool rail left, stage centre, parts/bones/pose right, timeline under the stage. Stacks on phones. */
:root{
  --bg:#ecebf3; --panel:#f8f7fc; --panel2:#e4e2ef; --line:#cdcae0; --fg:#1d1b2a; --dim:#645f7e;
  --accent:#d6307f; --accent-ink:#ffffff; --bone:#0b8f7d; --key:#b98400; --danger:#c62f3f;
  --chk1:#f2f1f8; --chk2:#e7e5f1; --shadow:0 6px 24px rgba(40,30,80,.16);
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141b; --panel:#1e1c27; --panel2:#272536; --line:#38354d; --fg:#ece9f6; --dim:#a29eba;
  --accent:#ff6fb1; --accent-ink:#2a0a1b; --bone:#5fe3d0; --key:#ffd23f; --danger:#ff7a86;
  --chk1:#1a1922; --chk2:#211f2b; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141b; --panel:#1e1c27; --panel2:#272536; --line:#38354d; --fg:#ece9f6; --dim:#a29eba;
  --accent:#ff6fb1; --accent-ink:#2a0a1b; --bone:#5fe3d0; --key:#ffd23f; --danger:#ff7a86;
  --chk1:#1a1922; --chk2:#211f2b; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0}
#top{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:800 20px/1 var(--f-display);letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.brand i{font:600 11px var(--f-mono);color:var(--dim);font-style:normal;letter-spacing:.04em}
#steps{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:10px;border:1px solid var(--line)}
#steps button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:700;color:var(--dim);display:flex;gap:8px;align-items:center}
#steps button b{font:600 11px var(--f-mono);opacity:.7}
#steps button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
#steps button[aria-selected="true"] b{opacity:.85}
.grow{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:6px 11px;border-radius:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{background:none}
.btn.danger{color:var(--danger)}
.ib{width:30px;height:30px;padding:0;justify-content:center}

#main{display:grid;grid-template-columns:64px minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}
#tools{grid-row:1 / span 2;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:8px 6px;overflow-y:auto}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;background:none;border-radius:9px;padding:7px 2px;font-size:10.5px;color:var(--dim);font-weight:500;line-height:1.1}
.tool:hover{background:var(--panel2);color:var(--fg)}
.tool[aria-pressed="true"]{background:var(--panel2);border-color:var(--accent);color:var(--fg)}
.tool[aria-pressed="true"] svg{color:var(--accent)}
.tool kbd{font:600 9px var(--f-mono);opacity:.55}
#stageCol{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
#opts{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px}
#opts label{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12.5px}
#opts input[type=range]{width:110px;accent-color:var(--accent)}
#opts .val{font:400 12px var(--f-mono);color:var(--fg);min-width:2.2em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:4px 10px;font-size:12.5px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
#hint{color:var(--dim);font-size:12.5px;flex:1 1 260px;min-width:0}
#stageWrap{position:relative;min-height:0;min-width:0;overflow:hidden;
  background-color:var(--chk1);
  background-image:linear-gradient(45deg,var(--chk2) 25%,transparent 25%,transparent 75%,var(--chk2) 75%),linear-gradient(45deg,var(--chk2) 25%,transparent 25%,transparent 75%,var(--chk2) 75%);
  background-size:24px 24px;background-position:0 0,12px 12px}
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#stage.pan{cursor:grab}
#drop{position:absolute;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--bg) 78%,transparent);display:grid;place-items:center;font:700 20px var(--f-display);pointer-events:none}
#empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#empty div{pointer-events:auto;text-align:center;max-width:340px;padding:16px}
#empty h2{font:800 26px/1.1 var(--f-display);margin:0 0 8px;letter-spacing:-.02em}
#empty p{color:var(--dim);margin:0 0 14px}
#zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;box-shadow:var(--shadow)}
#zoombar span{font:400 11px var(--f-mono);color:var(--dim);min-width:3.4em;text-align:center}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;box-shadow:var(--shadow);max-width:90%;display:flex;gap:12px;align-items:center}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}

#side{grid-row:1 / span 2;grid-column:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0}
.sec{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font:700 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.sec h3 .grow{flex:1}
.col{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;border:1px solid transparent;cursor:pointer;min-width:0}
.item:hover{background:var(--panel2)}
.item.on{background:var(--panel2);border-color:var(--accent)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.item .sub{font:400 10.5px var(--f-mono);color:var(--dim);white-space:nowrap}
.item.hid .nm{opacity:.45;text-decoration:line-through}
.item input.rn{flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:2px 6px}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.mini{border:0;background:none;padding:3px;border-radius:6px;color:var(--dim);display:grid;place-items:center}
.mini:hover{background:var(--line);color:var(--fg)}
.mini svg{width:15px;height:15px}
.empty-note{color:var(--dim);font-size:12.5px;padding:2px 0}
.field{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center}
.field label{color:var(--dim);font-size:12.5px}
.field small{display:block;font-size:11px;opacity:.75}
input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 7px;min-width:0;width:100%}
input[type=number]{font-family:var(--f-mono);font-size:12.5px}
input[type=checkbox]{accent-color:var(--accent)}

#timeline{grid-column:2;grid-row:2;background:var(--panel);border-top:1px solid var(--line);min-width:0;display:flex;flex-direction:column;max-height:42vh}
#tlbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line)}
#tlbar label{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12.5px}
#tlbar input[type=number]{width:62px}
#tlbar input[type=range]{width:90px;accent-color:var(--accent)}
#clock{font:600 13px var(--f-mono);min-width:7.5em;font-variant-numeric:tabular-nums}
#easeBox{display:flex;align-items:center;gap:6px}
#easePrev{width:44px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#easeSel{width:150px}
#tlScroll{overflow:auto;position:relative;min-height:0;flex:1}
#tlInner{position:relative;min-width:100%}
.tlrow{display:flex;height:28px;border-bottom:1px solid var(--line)}
.tllab{position:sticky;left:0;z-index:3;width:150px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px 0 16px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tllab.on{color:var(--accent);font-weight:700}
.tltrack{position:relative;flex:none;height:100%}
.tlruler{height:26px;background:var(--panel2);position:sticky;top:0;z-index:4}
.tlruler .tllab{background:var(--panel2);cursor:default;color:var(--dim);font:400 11px var(--f-mono)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font:400 10px var(--f-mono);color:var(--dim);padding-left:3px;padding-top:6px;pointer-events:none}
.tick.minor{border-left-color:color-mix(in srgb,var(--line) 55%,transparent);padding:0}
.key{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;transform:rotate(45deg);background:var(--key);border:1.5px solid var(--bg);border-radius:2px;cursor:ew-resize;z-index:2}
.key.sel{background:var(--accent);box-shadow:0 0 0 2px var(--fg)}
.key.liq{background:var(--bone);border-radius:50%}
#playhead{position:absolute;top:0;bottom:0;width:0;z-index:5;pointer-events:none}
#playhead::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--accent)}
#playhead::after{content:"";position:absolute;left:-6px;top:0;border:6px solid transparent;border-top-color:var(--accent);border-bottom:0}

@media (max-width:900px){
  html,body{height:auto}
  #app{height:auto;min-height:100%;display:block}
  #main{display:flex;flex-direction:column}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);order:1}
  .tool{min-width:58px;flex:none}
  #stageCol{order:2;height:62vh;min-height:360px}
  #timeline{order:3;max-height:none}
  #side{order:4;border-left:0;overflow:visible}
  .tllab{width:110px}
  #easeSel{width:120px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tutm{width:min(480px,100%);gap:14px}
.tutdots{display:flex;gap:6px}
.tutdots i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.tutdots i.on{background:var(--accent)}
.tuticons{display:flex;gap:8px;flex-wrap:wrap}
.tuticons span{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent)}
.tutp{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:9px;line-height:1.5}
.tutp b{font-weight:700}
.tutnav{margin-top:2px}
.chk{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px}

.modal-back{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.55);display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font:800 22px/1 var(--f-display);letter-spacing:-.02em}
.modal .field{grid-template-columns:90px 1fr}
.modal .col .btn{justify-content:center}
button:disabled{opacity:.4;cursor:default}
</style>

<div id="app">
  <header id="top">
    <div class="brand">Tweenslop <i>cutout animator</i></div>
    <div id="steps" role="tablist" aria-label="Workflow">
      <button role="tab" data-step="cut"><b>1</b> Cut</button>
      <button role="tab" data-step="rig"><b>2</b> Rig</button>
      <button role="tab" data-step="animate"><b>3</b> Animate</button>
      <button role="tab" data-step="fx"><b>4</b> FX</button>
    </div>
    <div class="grow"></div>
    <button class="btn ib" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="btn ib" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="btn ib" id="btnHelp" aria-label="How to use Tweenslop" title="How to use">?</button>
    <button class="btn" id="btnOpen"><svg class="i"><use href="#i-upload"/></svg>Image</button>
    <button class="btn" id="btnProject" title="Open a saved .tsproj project">Open project</button>
    <button class="btn primary" id="btnExport"><svg class="i"><use href="#i-download"/></svg>Export</button>
    <input type="file" id="fileImg" accept="image/*" class="sr" tabindex="-1">
    <input type="file" id="fileProj" accept=".tsproj,.json,application/json" class="sr" tabindex="-1">
  </header>

  <div id="main">
    <nav id="tools" aria-label="Tools"></nav>

    <div id="stageCol">
      <div id="opts"><div id="optsInner" class="row" style="gap:6px 16px"></div><div id="hint"></div></div>
      <div id="stageWrap">
        <canvas id="stage" tabindex="0" aria-label="Animation stage"></canvas>
        <div id="drop" hidden>Drop an image to start</div>
        <div id="empty" hidden><div>
          <h2>Drop in a character</h2>
          <p>Upload any picture, cut the character into parts, give it bones, then pose it on the timeline.</p>
          <button class="btn primary" id="btnOpen2"><svg class="i"><use href="#i-upload"/></svg>Choose image</button>
          <button class="btn" id="btnSample2">Load the sample</button>
        </div></div>
        <div id="zoombar">
          <button class="mini" id="zOut" aria-label="Zoom out"><svg class="i"><use href="#i-down"/></svg></button>
          <span id="zVal">100%</span>
          <button class="mini" id="zIn" aria-label="Zoom in"><svg class="i"><use href="#i-up"/></svg></button>
          <button class="mini" id="zFit" aria-label="Fit to view" title="Fit (F)"><svg class="i"><use href="#i-fit"/></svg></button>
        </div>
        <div id="toast" hidden role="status"></div>
      </div>
    </div>

    <aside id="side">
      <section class="sec" id="secParts">
        <h3>Parts <span class="grow"></span>
          <button class="btn sm" id="btnNewPart" data-for="cut"><svg class="i" style="width:13px;height:13px"><use href="#i-plus"/></svg>New part</button>
          <button class="btn sm" id="btnAutoBind" data-for="rig">Auto-bind</button></h3>
        <div class="list" id="partList"></div>
      </section>
      <section class="sec" id="secPart" data-for="cut rig">
        <h3>Selected part</h3>
        <div id="partOpts" class="col"></div>
      </section>
      <section class="sec" id="secBones" data-for="rig animate">

function medianCut(counts, target) {

const hexRGB=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];};
const hs=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);};
const nz=(x,s)=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hs(i+s*17.3),hs(i+1+s*17.3),u)*2-1;};

const fxList=()=>S.anim.fx||(S.anim.fx=[]);
function fxMo(e,t){const d=Math.max(S.anim.dur,.01),n=e.g.n||1;let u=t/d*n;u=u>=n-1e-6?1:u%1;const m=curveEval(e.g.pts,e.g.m,u);return Math.abs(m)<.002?0:m;}
function fxMat(E,t,pv){let M=MI;for(const e of E){const m=fxMo(e,t);if(!m)continue;const p=e.p,T=e.type,w=6.2832*(p.sp||0)*t;let dx=0,dy=0,r=0,sx=1,sy=1,kx=0;
  if(T==='shake'){dx=nz(t*p.sp,1)*p.amt*m;dy=nz(t*p.sp,2)*p.amt*m;r=nz(t*p.sp,3)*p.rot*m;}
  else if(T==='wobble'){r=Math.sin(w)*p.rot*m;const q=Math.cos(w)*p.sq/100*m;sx=1+q;sy=1-q;}
  else if(T==='pulse'){sx=sy=1+Math.sin(w)*p.amt/100*m;}
  else if(T==='float'){dx=Math.sin(w)*p.x*m;dy=Math.sin(w*1.3+1)*p.y*m;}
  else if(T==='spin'){r=p.rate*t*m;}
  else if(T==='jitter'){const fr=Math.floor(t*p.fps);dx=(hs(fr*3.1)-.5)*2*p.amt*m;dy=(hs(fr*5.7+9)-.5)*2*p.amt*m;r=(hs(fr*7.3+4)-.5)*2*p.rot*m;}
  else if(T==='skew'){kx=Math.tan(Math.sin(w)*p.ang*m*Math.PI/180);}
  else if(T==='bounce'){const a=Math.abs(Math.sin(w/2)),q=(1-a)*p.sq/100*m;dy=-a*p.h*m;sx=1+q;sy=1-q;}else if(T==='orbit'){dx=Math.cos(w)*p.rx*m;dy=Math.sin(w)*p.ry*m;}
  else if(T==='zoom'){sx=sy=1+p.amt/100*m*t/Math.max(S.anim.dur,.01);}
  else if(T==='oscillate'){const v=p.shape==1?2/Math.PI*Math.asin(Math.sin(w)):p.shape==2?Math.sign(Math.sin(w)):Math.sin(w),a=p.ang*Math.PI/180;dx=Math.cos(a)*p.dist*v*m;dy=Math.sin(a)*p.dist*v*m;r=p.rot*v*m;sx=sy=1+p.sc/100*v*m;}
  else if(T==='flip'){sx=1-m+m*Math.cos(w/2);}
  else if(T==='heartbeat'){const ph=((p.sp*t)%1+1)%1,bt=Math.exp(-(((ph-.1)/.05)**2))+.7*Math.exp(-(((ph-.3)/.06)**2));sx=sy=1+p.amt/100*bt*m;}
  else if(T==='drift'){dx=p.vx*t*m;dy=p.vy*t*m;}
  else if(T==='wiggle'){dx=nz(t*p.sp,11)*p.amt*m;dy=nz(t*p.sp,12)*p.amt*m;r=nz(t*p.sp,13)*p.rot*m;}else continue;
  M=mmul(M,mmul(mmul(mmul(mmul(mT(pv[0]+dx,pv[1]+dy),mR(r*Math.PI/180)),[1,0,kx,1,0,0]),mS(sx,sy)),mT(-pv[0],-pv[1])));}return M;}
let FXD=0;const FXC={};
function fxCv(k,W,H){let c=FXC[k];if(!c||c.width!==W||c.height!==H){c=FXC[k]=mkCanvas(W,H);}return c;}
function fxCopy(c,W,H,k){const t=fxCv(k,W,H),x=t.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.globalAlpha=1;x.clearRect(0,0,W,H);x.drawImage(c.canvas,0,0);return t;}
function fxBlur(c,r,s,k){if(r<.5)return;const W=s.W,H=s.H,tm=fxCopy(c,W,H,k);c.clearRect(0,0,W,H);
  if(typeof c.filter==='string'){c.filter='blur('+r+'px)';c.drawImage(tm,0,0);c.filter='none';}
  else{const f=Math.max(2,Math.round(r)),w=Math.max(1,Math.ceil(W/f)),h=Math.max(1,Math.ceil(H/f)),sm=fxCv(k+'s',w,h),x=sm.getContext('2d');x.clearRect(0,0,w,h);x.drawImage(tm,0,0,w,h);c.drawImage(sm,0,0,w,h,0,0,W,H);}}
const FXOP={
 chroma(c,p,m,s){const d=c.getImageData(0,0,s.W,s.H),a=d.data,k=hexRGB(p.color),tol=p.tol*4.4,sf=p.soft*4.4+1,mix=clamp(m,0,1),sp=p.spill/100*mix;
  const j=k[0]>=k[1]&&k[0]>=k[2]?0:k[1]>=k[2]?1:2,o1=(j+1)%3,o2=(j+2)%3;
  for(let i=0;i<a.length;i+=4){if(!a[i+3])continue;const dist=Math.hypot(a[i]-k[0],a[i+1]-k[1],a[i+2]-k[2]),kk=clamp((dist-tol)/sf,0,1);a[i+3]*=1-mix+mix*kk;
   if(sp){const w=clamp(1-dist/(tol+sf*3+60),0,1)*sp,av=(a[i+o1]+a[i+o2])/2;if(a[i+j]>av)a[i+j]=lerp(a[i+j],av,w);}}c.putImageData(d,0,0);},
 luma(c,p,m,s){const d=c.getImageData(0,0,s.W,s.H),a=d.data,mix=clamp(m,0,1),lv=p.lv*2.55,sf=p.soft*2.55+1;
  for(let i=0;i<a.length;i+=4){let k=clamp((.299*a[i]+.587*a[i+1]+.114*a[i+2]-lv)/sf,0,1);if(p.inv)k=1-k;a[i+3]*=1-mix+mix*k;}c.putImageData(d,0,0);},
 hue(c,p,m,s){const d=c.getImageData(0,0,s.W,s.H),a=d.data,g=(p.deg+p.spin*s.t)*m*Math.PI/180,cs=Math.cos(g),sn=Math.sin(g);
  const M=[.213+cs*.787-sn*.213,.715-cs*.715-sn*.715,.072-cs*.072+sn*.928,.213-cs*.213+sn*.143,.715+cs*.285+sn*.140,.072-cs*.072-sn*.283,.213-cs*.213-sn*.787,.715-cs*.715+sn*.715,.072+cs*.928+sn*.072];
  for(let i=0;i<a.length;i+=4){const r=a[i],g2=a[i+1],b=a[i+2];a[i]=M[0]*r+M[1]*g2+M[2]*b;a[i+1]=M[3]*r+M[4]*g2+M[5]*b;a[i+2]=M[6]*r+M[7]*g2+M[8]*b;}c.putImageData(d,0,0);},
 tint(c,p,m,s){const d=c.getImageData(0,0,s.W,s.H),a=d.data,k=hexRGB(p.color),q=clamp(p.amt/100*m,0,1);
  for(let i=0;i<a.length;i+=4){a[i]+=(k[0]-a[i])*q;a[i+1]+=(k[1]-a[i+1])*q;a[i+2]+=(k[2]-a[i+2])*q;}c.putImageData(d,0,0);},
 adjust(c,p,m,s){const d=c.getImageData(0,0,s.W,s.H),a=d.data,b=p.b*2.55*m,ct=1+p.c/100*m,sa=1+p.s/100*m;
  for(let i=0;i<a.length;i+=4){const l=.299*a[i]+.587*a[i+1]+.114*a[i+2];for(let j=0;j<3;j++)a[i+j]=((l+(a[i+j]-l)*sa)-128)*ct+128+b;}c.putImageData(d,0,0);},
 wave(c,p,m,s){const W=s.W,H=s.H,tm=fxCopy(c,W,H,'t'+s.dk),amp=p.amp*s.sc*m,len=p.len*s.sc,ph=s.t*p.sp*6.2832;c.clearRect(0,0,W,H);
  if(p.dir)for(let x=0;x<W;x+=2)c.drawImage(tm,x,0,2,H,x,Math.sin(x/len*6.2832+ph)*amp,2,H);
  else for(let y=0;y<H;y+=2)c.drawImage(tm,0,y,W,2,Math.sin(y/len*6.2832+ph)*amp,y,W,2);},
 rgb(c,p,m,s){const W=s.W,H=s.H,d=c.getImageData(0,0,W,H),a=d.data,src=new Uint8ClampedArray(a),an=p.ang*Math.PI/180,ox=Math.round(Math.cos(an)*p.off*s.sc*m),oy=Math.round(Math.sin(an)*p.off*s.sc*m);if(!ox&&!oy)return;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4,xr=x-ox,yr=y-oy,xb=x+ox,yb=y+oy,ir=xr>=0&&xr<W&&yr>=0&&yr<H?(yr*W+xr)*4:-1,ib=xb>=0&&xb<W&&yb>=0&&yb<H?(yb*W+xb)*4:-1;
   a[i]=ir<0?0:src[ir];a[i+2]=ib<0?0:src[ib];a[i+3]=Math.max(src[i+3],ir<0?0:src[ir+3],ib<0?0:src[ib+3]);}c.putImageData(d,0,0);},
 pixel(c,p,m,s){const q=Math.round(p.size*s.sc*Math.min(1,m));if(q<2)return;const w=Math.max(1,Math.ceil(s.W/q)),h=Math.max(1,Math.ceil(s.H/q)),tm=fxCv('p'+s.dk,w,h),x=tm.getContext('2d');
  x.clearRect(0,0,w,h);x.drawImage(c.canvas,0,0,w,h);c.clearRect(0,0,s.W,s.H);c.imageSmoothingEnabled=false;c.drawImage(tm,0,0,w,h,0,0,w*q,h*q);c.imageSmoothingEnabled=true;},
 blur(c,p,m,s){fxBlur(c,p.r*s.sc*m,s,'b'+s.dk);},
 glow(c,p,m,s){const W=s.W,H=s.H,o=fxCopy(c,W,H,'g'+s.dk);fxBlur(c,p.r*s.sc,s,'h'+s.dk);const bl=fxCopy(c,W,H,'i'+s.dk);
  c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';c.globalAlpha=clamp(p.str/100*m,0,1);c.drawImage(bl,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.drawImage(o,0,0);},
 glitch(c,p,m,s){const W=s.W,H=s.H,tm=fxCopy(c,W,H,'l'+s.dk),fr=Math.floor(s.t*p.sp);
  for(let i=0;i<p.n;i++){if(hs(fr*7.7+i*3.1)<.5)continue;const y=Math.floor(hs(fr+i*5.3)*H),h=Math.ceil(hs(fr*1.3+i)*H*.12)+2,dx=(hs(fr*2.1+i*9.7)-.5)*2*p.shift*s.sc*m;c.clearRect(0,y,W,h);c.drawImage(tm,0,y,W,h,dx,y,W,h);}}
};
function fxRun(ctx,drawFn,pix,t,px){const dk=FXD++;try{
  const sc=clamp(px,.25,2),pd=FXM(),W=Math.max(1,Math.round((S.w+2*pd)*sc)),H=Math.max(1,Math.round((S.h+2*pd)*sc)),cv=fxCv('m'+dk,W,H),c=cv.getContext('2d',{willReadFrequently:true});
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);c.setTransform(sc,0,0,sc,pd*sc,pd*sc);drawFn(c);c.setTransform(1,0,0,1,0,0);
  const st={al:1,dk,sc,W,H,t};
  for(const o of pix){if(o.e.type==='fade')st.al*=1-clamp(o.m*o.e.p.amt/100,0,1);else FXOP[o.e.type](c,o.e.p,o.m,st);}
  ctx.save();ctx.globalAlpha*=st.al;ctx.drawImage(cv,0,0,W,H,-pd,-pd,S.w+2*pd,S.h+2*pd);ctx.restore();}finally{FXD--;}}
const FXM=()=>Math.round(.2*Math.max(S.w,S.h));
const fxPix=(E,t)=>E.filter(e=>PIX.has(e.type)).map(e=>({e,m:fxMo(e,t)})).filter(o=>o.m);
function drawParts(ctx,pose,t,rest,px,E){
  for(const p of S.parts){if(!p.visible)continue;if(p.dirty)rebuildPart(p);if(!p.tex)continue;
    const f=rest?null:liqAt(p.id,t),mine=E.filter(e=>e.target===p.id);
    if(!mine.length){drawPart(ctx,p,pose,f,px);continue;}
    if(p._cenT!==p.tex){p._cen=partCentroid(p)||[S.w/2,S.h/2];p._cenT=p.tex;}
    const b=p.bone?getBone(p.bone):null,pv=b?mapp(pose.M[b.id],p._cen[0],p._cen[1]):p._cen,M=fxMat(mine,t,pv),pix=fxPix(mine,t);
    const one=c=>{c.save();c.transform(M[0],M[1],M[2],M[3],M[4],M[5]);drawPart(c,p,pose,f,px);c.restore();};
    pix.length?fxRun(ctx,one,pix,t,px):one(ctx);}}
function drawScene(ctx,pose,t,rest,px){
  const E=rest?[]:fxList().filter(e=>e.on&&FXDEF[e.type]);
  if(!rest&&!FXMB){const f=E.find(e=>e.type==='mblur'&&e.target==='all'&&fxMo(e,t));
    if(f){mbDraw(ctx,f.p,fxMo(f,t),S.anim.fps,t,px);return;}if(EXPMB){mbDraw(ctx,EXPMB,1,EXPMB.fps,t,px);return;}}
  if(!E.length){drawParts(ctx,pose,t,rest,px,[]);return;}
  const A=E.filter(e=>e.target==='all'),pix=fxPix(A,t),G=fxMat(A,t,[S.w/2,S.h/2]);
  const body=c=>{c.save();c.transform(G[0],G[1],G[2],G[3],G[4],G[5]);drawParts(c,pose,t,rest,px,E);c.restore();};
  pix.length?fxRun(ctx,body,pix,t,px):body(ctx);}

 echo:{cat:'distort',name:'Echo trail',p:[['n','Copies',1,12,1,5,''],['gap','Spacing',1,60,1,12,'px'],['ang','Direction',0,360,1,90,'°'],['op','Opacity',0,100,1,60,'%']]},
 edges:{cat:'distort',name:'Edge ink',p:[['color','Ink','color','#111111'],['str','Strength',10,200,1,80,'%'],['th','Cut-off',0,200,1,40,''],['keep','Keep picture (1)',0,1,1,1,'']]},

 bars:{cat:'color',name:'Cinema bars',p:[['sz','Height',0,60,1,12,'%'],['color','Colour','color','#000000']]}});
['twirl','vhs','halftone','echo','edges','zoomblur','snow','bars'].forEach(k=>PIX.add(k));
Object.assign(FXOP,{
 twirl(c,p,m,s){const cx=s.W/2,cy=s.H/2,R=Math.min(s.W,s.H)/2*p.r/100,A=(p.amt+p.spin*s.t)*Math.PI/180*m;fxWarp(c,s,(x,y)=>{const dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy)/R;if(r>=1)return[x,y];const a=A*(1-r)*(1-r),cs=Math.cos(a),sn=Math.sin(a);return[cx+dx*cs-dy*sn,cy+dx*sn+dy*cs];});},
 vhs(c,p,m,s){const W=s.W,H=s.H,tm=fxCopy(c,W,H,'v'+s.dk),roll=(s.t*p.sp)%1;c.clearRect(0,0,W,H);
  for(let y=0;y<H;y+=2){let dx=Math.sin(y/(14*s.sc)+s.t*6)*p.wob*s.sc*m;const b=y/H-roll;if(Math.abs(b)<.04)dx+=p.tear*s.sc*m*(b>0?1:-1);c.drawImage(tm,0,y,W,2,dx,y,W,2);}
  c.save();c.globalCompositeOperation='source-atop';c.fillStyle='rgba(0,0,0,'+.18*clamp(m,0,1)+')';for(let y=0;y<H;y+=4*s.sc)c.fillRect(0,y,W,2*s.sc);c.restore();},
 halftone(c,p,m,s){const W=s.W,H=s.H,g=Math.max(3,p.size*s.sc),a=c.getImageData(0,0,W,H).data;c.clearRect(0,0,W,H);
  for(let y=g/2;y<H;y+=g)for(let x=g/2;x<W;x+=g){const i=((y|0)*W+(x|0))*4;if(a[i+3]<20)continue;const l=(.299*a[i]+.587*a[i+1]+.114*a[i+2])/255;c.fillStyle='rgb('+a[i]+','+a[i+1]+','+a[i+2]+')';c.beginPath();c.arc(x,y,g*.7*(.25+.75*(1-l)),0,7);c.fill();}},
 echo(c,p,m,s){const W=s.W,H=s.H,tm=fxCopy(c,W,H,'e'+s.dk),an=p.ang*Math.PI/180,q=clamp(m,0,1);c.clearRect(0,0,W,H);
  for(let i=p.n;i>=1;i--){c.globalAlpha=p.op/100*(1-i/(p.n+1))*q;c.drawImage(tm,Math.cos(an)*p.gap*s.sc*i,Math.sin(an)*p.gap*s.sc*i);}c.globalAlpha=1;c.drawImage(tm,0,0);},
 edges(c,p,m,s){const W=s.W,H=s.H,d=c.getImageData(0,0,W,H),a=d.data,V=new Float32Array(W*H),k=hexRGB(p.color),out=p.keep?new Uint8ClampedArray(a):new Uint8ClampedArray(a.length);
  for(let i=0;i<W*H;i++){const j=i*4;V[i]=(.299*a[j]+.587*a[j+1]+.114*a[j+2])*a[j+3]/255+a[j+3]*.5;}
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,gx=V[i-W+1]+2*V[i+1]+V[i+W+1]-V[i-W-1]-2*V[i-1]-V[i+W-1],gy=V[i+W-1]+2*V[i+W]+V[i+W+1]-V[i-W-1]-2*V[i-W]-V[i-W+1],mg=Math.hypot(gx,gy)*p.str/100*clamp(m,0,1);
   if(mg>p.th){const j=i*4,al=Math.min(255,mg*1.5);out[j]=k[0];out[j+1]=k[1];out[j+2]=k[2];out[j+3]=Math.max(out[j+3],al);}}
  c.putImageData(new ImageData(out,W,H),0,0);},
 zoomblur(c,p,m,s){const W=s.W,H=s.H,tm=fxCopy(c,W,H,'z'+s.dk);c.clearRect(0,0,W,H);c.globalCompositeOperation='lighter';c.globalAlpha=1/p.n;
  for(let i=0;i<p.n;i++){const k=1+(i/(p.n-1)-.5)*p.amt/100*m;c.setTransform(k,0,0,k,W/2*(1-k),H/2*(1-k));c.drawImage(tm,0,0);}
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';},
 snow(c,p,m,s){const W=s.W,H=s.H;c.fillStyle=p.color;c.globalAlpha=clamp(m,0,1)*.9;for(let i=0;i<p.n;i++){const sp=.4+hs(i*1.7)*.8,x=((hs(i*3.1)*W+Math.sin(s.t*2+i)*8*s.sc)%W+W)%W,y=((hs(i*7.7)*H+s.t*p.fall*s.sc*sp)%H+H)%H;c.beginPath();c.arc(x,y,(1+hs(i*5.3)*p.size)*s.sc,0,7);c.fill();}c.globalAlpha=1;},
 bars(c,p,m,s){const h=s.H*p.sz/100*clamp(m,0,1)/2;c.fillStyle=p.color;c.fillRect(0,0,s.W,h);c.fillRect(0,s.H-h,s.W,h);}});
